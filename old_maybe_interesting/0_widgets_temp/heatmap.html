<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Year Activity Heatmap</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Inter, Arial, sans-serif;
}

body {
    background: #f4f6fa;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 1x1 container */
.wrapper {
    width: min(92vw, 92vh);
    aspect-ratio: 1 / 1;
    max-width: 760px;
}

#widget {
    width: 100%;
    height: 100%;
    background: white;
    border-radius: 24px;
    border: 1px solid #e7ebf1;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);

    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* HEADER */
.header {
    padding: 4% 5%;
    border-bottom: 1px solid #eef2f6;
    position: relative;
}

.title {
    font-size: clamp(18px, 2vw, 26px);
    font-weight: 700;
    color: #111827;
}

.subtitle {
    margin-top: 4px;
    font-size: 12px;
    color: #7b8494;
}

.toggle {
    position: absolute;
    right: 14px;
    top: 14px;
    padding: 7px 10px;
    font-size: 12px;
    background: #f3f5f9;
    border: 1px solid #e6ebf2;
    border-radius: 10px;
    cursor: pointer;
}

/* MONTHS */
.months {
    display: flex;
    justify-content: space-between;
    padding: 6px 6% 0 6%;
    font-size: 10px;
    color: #9aa4b2;
}

/* MAIN AREA */
.content {
    flex: 1;
    display: flex;
    padding: 3% 4%;
    gap: 8px;
}

/* weekdays */
.weekdays {
    display: grid;
    grid-template-rows: repeat(7, 1fr);
    font-size: 10px;
    color: #9aa4b2;
    padding-right: 6px;
}

/* heatmap grid (true squares) */
.heatmap {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(53, 1fr);
    grid-auto-rows: 1fr;
    gap: 3px;
}

.cell {
    aspect-ratio: 1 / 1; /* 🔥 echte Quadrate */
    border-radius: 3px;
    background: #ebedf0;
    transition: 0.15s;
}

.cell:hover {
    transform: scale(1.2);
    z-index: 2;
}

/* BOTTOM PANEL */
.bottom {
    height: 30%;
    border-top: 1px solid #eef2f6;
    display: flex;
    flex-direction: column;
    padding: 12px 16px;
    gap: 10px;
}

/* category switch */
.categories {
    display: flex;
    gap: 8px;
}

.cat {
    flex: 1;
    padding: 8px;
    text-align: center;
    font-size: 12px;
    border-radius: 10px;
    background: #f3f5f9;
    border: 1px solid #e6ebf2;
    cursor: pointer;
    transition: 0.2s;
}

.cat.active {
    background: #111827;
    color: white;
    border-color: #111827;
}

/* legend */
.legend {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #9aa4b2;
}

.scale {
    display: flex;
    gap: 4px;
    align-items: center;
}

.box {
    width: 10px;
    height: 10px;
    border-radius: 2px;
}

.footer-note {
    text-align: center;
    font-size: 11px;
    color: #94a3b8;
}
</style>
</head>

<body>

<div class="wrapper">
<div id="widget">

    <div class="header">
        <div class="title">Activity Heatmap</div>
        <div class="subtitle" id="subtitle">2026 · Scroll</div>
        <div class="toggle" id="yearBtn">Letztes Jahr</div>
    </div>

    <div class="months" id="months"></div>

    <div class="content">
        <div class="weekdays">
            <div>Mo</div><div>Di</div><div>Mi</div>
            <div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
        </div>

        <div class="heatmap" id="heatmap"></div>
    </div>

    <div class="bottom">

        <div class="categories">
            <div class="cat active" data-type="scroll">Scroll</div>
            <div class="cat" data-type="focus">Fokus</div>
            <div class="cat" data-type="productivity">Produktiv</div>
            <div class="cat" data-type="events">Ereignisse</div>
        </div>

        <div class="legend">
            <div class="scale">
                wenig
                <div class="box" style="background:#ebedf0"></div>
                <div class="box" style="background:#9be9a8"></div>
                <div class="box" style="background:#40c463"></div>
                <div class="box" style="background:#30a14e"></div>
                <div class="box" style="background:#0e4429"></div>
                viel
            </div>
        </div>

        <div class="footer-note">
            Dunkler = höhere Aktivität
        </div>

    </div>

</div>
</div>

<script>

let year = 2026;
let viewYear = 2026;
let currentType = "scroll";

const heatmap = document.getElementById("heatmap");
const monthsEl = document.getElementById("months");
const subtitle = document.getElementById("subtitle");

/* category color styles (leicht unterschiedlich pro Modus) */
function color(v, type) {

    const base = {
        scroll:     [15, 35, 55, 75],
        focus:      [20, 40, 60, 80],
        productivity:[10, 30, 50, 70],
        events:     [25, 45, 65, 85]
    }[type];

    if (v < base[0]) return "#ebedf0";
    if (v < base[1]) return "#9be9a8";
    if (v < base[2]) return "#40c463";
    if (v < base[3]) return "#30a14e";
    return "#0e4429";
}

function data(days) {
    return Array.from({ length: days }, () =>
        Math.floor(Math.random() * 100)
    );
}

function buildMonths() {
    monthsEl.innerHTML = "";
    ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"]
        .forEach(m => {
            const d = document.createElement("div");
            d.textContent = m;
            monthsEl.appendChild(d);
        });
}

function buildYear(y, type) {

    heatmap.innerHTML = "";
    buildMonths();

    const start = new Date(y, 0, 1);
    const end = new Date(y, 11, 31);
    const days = Math.round((end - start) / (1000*60*60*24)) + 1;

    const values = data(days);

    for (let i = 0; i < days; i++) {

        const date = new Date(y, 0, 1 + i);
        const dayOfWeek = (date.getDay() + 6) % 7;
        const week = Math.floor(i / 7);

        const cell = document.createElement("div");
        cell.className = "cell";

        cell.style.gridColumn = week + 1;
        cell.style.gridRow = dayOfWeek + 1;

        const val = values[i];
        cell.style.background = color(val, type);

        cell.title = `${date.toLocaleDateString()} · ${val}`;

        heatmap.appendChild(cell);
    }

    subtitle.textContent = `${y} · ${type.toUpperCase()}`;
}

/* category switching */
document.querySelectorAll(".cat").forEach(btn => {
    btn.addEventListener("click", () => {

        document.querySelectorAll(".cat").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        currentType = btn.dataset.type;
        buildYear(viewYear, currentType);
    });
});

/* year toggle */
document.getElementById("yearBtn").addEventListener("click", () => {

    viewYear = (viewYear === year) ? year - 1 : year;

    document.getElementById("yearBtn").textContent =
        viewYear === year ? "Letztes Jahr" : "Dieses Jahr";

    buildYear(viewYear, currentType);
});

/* init */
buildYear(viewYear, currentType);

</script>

</body>
</html>
