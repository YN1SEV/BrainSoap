<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Minimal URL Collections</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Inter, Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(180deg, #f7f9fc 0%, #eef3f8 100%);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 26px;
    }

    .widget-wrapper {
        width: min(66vw, 1200px);
        min-width: 340px;
    }

    #widget {
        width: 100%;
        background: rgba(255,255,255,0.82);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255,255,255,0.65);
        border-radius: 26px;
        box-shadow: 0 10px 34px rgba(15,23,42,0.06),
                    0 2px 8px rgba(15,23,42,0.04);
        overflow: hidden;
    }

    .header {
        padding: 24px 26px 18px 26px;
        border-bottom: 1px solid rgba(226,232,240,0.7);
    }

    .title {
        font-size: 24px;
        font-weight: 700;
        color: #0f172a;
    }

    .subtitle {
        margin-top: 6px;
        font-size: 13px;
        color: #64748b;
    }

    .content {
        padding: 18px;
    }

    .groups {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    /* GROUP */
    .group {
        background: rgba(255,255,255,0.72);
        border: 1px solid #e7edf4;
        border-radius: 18px;
        overflow: hidden;
        transition: 0.18s ease;
    }

    .group:hover {
        border-color: #d9e3ee;
    }

    .group-header {
        padding: 0;
    }

    .group-toggle {
        width: 100%;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        background: transparent;
        border: none;
        cursor: pointer;
    }

    .group-left {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .group-letter {
        width: 30px;
        height: 30px;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
    }

    .group-title {
        font-size: 16px;
        font-weight: 700;
        color: #0f172a;
    }

    .group-count {
        margin-top: 2px;
        font-size: 12px;
        color: #64748b;
    }

    .arrow {
        color: #94a3b8;
        transition: 0.18s ease;
    }

    .group.collapsed .arrow {
        transform: rotate(-90deg);
    }

    .group-body {
        padding: 0 12px 12px 12px;
    }

    .group.collapsed .group-body {
        display: none;
    }

    /* URL LIST */
    .url-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 10px;
    }

    .url-item a {
        min-height: 62px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        background: rgba(248,250,252,0.92);
        border: 1px solid #edf2f7;
        border-radius: 15px;
        text-decoration: none;
        color: inherit;
        transition: 0.18s ease;
    }

    .url-item a:hover {
        background: #f8fbff;
        border-color: #dce6f0;
    }

    .favicon-wrap {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: white;
        border: 1px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .favicon {
        width: 20px;
        height: 20px;
    }

    .site-name {
        font-size: 15px;
        font-weight: 700;
        color: #0f172a;
    }

    .site-url {
        margin-top: 4px;
        font-size: 12px;
        color: #64748b;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* ADD URL */
    .add-url {
        display: flex;
        gap: 8px;
    }

    .url-input {
        flex: 1;
        height: 40px;
        border-radius: 12px;
        border: 1px solid #dbe3ec;
        padding: 0 14px;
        font-size: 13px;
        outline: none;
    }

    .add-url-btn {
        border: none;
        height: 40px;
        padding: 0 16px;
        border-radius: 12px;
        background: #2563eb;
        color: white;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }

    /* NEW GROUP */
    .new-group {
        display: flex;
        gap: 10px;
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid #edf2f7;
    }

    .group-input {
        flex: 1;
        height: 44px;
        border-radius: 14px;
        border: 1px solid #dbe3ec;
        padding: 0 16px;
    }

    .add-group-btn {
        border: none;
        height: 44px;
        padding: 0 18px;
        border-radius: 14px;
        background: #0f172a;
        color: white;
        cursor: pointer;
    }
</style>
</head>

<body>


<div id="widget">

    <div class="content">

        <div id="groups" class="groups"></div>

        <div class="new-group">
            <input id="groupInput" class="group-input" placeholder="Neue Liste..." />
            <button id="addGroupBtn" class="add-group-btn">Liste hinzufügen</button>
        </div>

    </div>

</div>

</div>

<script>
const groupsContainer = document.getElementById("groups");
const groupInput = document.getElementById("groupInput");
const addGroupBtn = document.getElementById("addGroupBtn");

function favicon(url) {
    return `https://www.google.com/s2/favicons?domain=${url}&sz=64`;
}

function siteName(hostname) {
    const clean = hostname.replace("www.", "").split(".")[0];
    return clean.charAt(0).toUpperCase() + clean.slice(1);
}

function updateCount(group) {
    const count = group.querySelectorAll(".url-item").length;
    group.querySelector(".group-count").innerText = `${count} Links`;
}

function createUrlItem(group, rawUrl) {

    if (!rawUrl.trim()) return;

    let finalUrl = rawUrl.trim();

    if (!finalUrl.startsWith("http")) {
        finalUrl = "https://" + finalUrl;
    }

    try {
        const parsed = new URL(finalUrl);
        const hostname = parsed.hostname;

        const li = document.createElement("li");
        li.className = "url-item";

        li.innerHTML = `
            <a href="${finalUrl}" target="_blank" rel="noopener">
                <div class="favicon-wrap">
                    <img class="favicon" src="${favicon(finalUrl)}" />
                </div>

                <div>
                    <div class="site-name">${siteName(hostname)}</div>
                    <div class="site-url">${finalUrl}</div>
                </div>
            </a>
        `;

        group.querySelector(".url-list").appendChild(li);

        const items = [...group.querySelectorAll(".url-item")];

        items.sort((a, b) =>
            a.innerText.toLowerCase().localeCompare(b.innerText.toLowerCase())
        );

        items.forEach(i =>
            group.querySelector(".url-list").appendChild(i)
        );

        updateCount(group);
        group.querySelector(".url-input").value = "";

    } catch {
        alert("Ungültige URL");
    }
}

function createGroup(name) {

    const section = document.createElement("section");
    section.className = "group";
    section.dataset.name = name.toLowerCase();

    section.innerHTML = `
        <header class="group-header">
            <button class="group-toggle" aria-expanded="true">
                <div class="group-left">
                    <div class="group-letter">${name[0].toUpperCase()}</div>
                    <div>
                        <div class="group-title">${name}</div>
                        <div class="group-count">0 Links</div>
                    </div>
                </div>
                <div class="arrow">⌄</div>
            </button>
        </header>

        <div class="group-body">
            <ul class="url-list"></ul>

            <form class="add-url">
                <input class="url-input" placeholder="https://example.com" />
                <button class="add-url-btn">Hinzufügen</button>
            </form>
        </div>
    `;

    const toggle = section.querySelector(".group-toggle");

    toggle.addEventListener("click", () => {
        const collapsed = section.classList.toggle("collapsed");
        toggle.setAttribute("aria-expanded", !collapsed);
    });

    section.querySelector(".add-url")
        .addEventListener("submit", (e) => {
            e.preventDefault();

            const input = section.querySelector(".url-input");
            createUrlItem(section, input.value);
        });

    groupsContainer.appendChild(section);
}

addGroupBtn.addEventListener("click", () => {
    const name = groupInput.value.trim();
    if (!name) return;

    createGroup(name);
    groupInput.value = "";
});

groupInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addGroupBtn.click();
});

/* DUMMY DATA */
createGroup("AI");
createGroup("Development");
createGroup("Design");
createGroup("Video");

const groups = document.querySelectorAll(".group");

createUrlItem(groups[0], "https://chatgpt.com");
createUrlItem(groups[0], "https://claude.ai");
createUrlItem(groups[0], "https://perplexity.ai");

createUrlItem(groups[1], "https://github.com");
createUrlItem(groups[1], "https://stackoverflow.com");
createUrlItem(groups[1], "https://vercel.com");

createUrlItem(groups[2], "https://figma.com");
createUrlItem(groups[2], "https://dribbble.com");

createUrlItem(groups[3], "https://youtube.com");
createUrlItem(groups[3], "https://vimeo.com");
</script>

</body>
</html>
