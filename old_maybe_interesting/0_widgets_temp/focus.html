<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Focus Mode Timer</title>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/progressbar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>

<style>
    *{
        box-sizing:border-box;
        margin:0;
        padding:0;
        font-family:Inter,Arial,sans-serif;
    }

    body{
        min-height:100vh;

        background:
            linear-gradient(
                180deg,
                #f7f9fc 0%,
                #eef3f8 100%
            );

        display:flex;
        justify-content:center;
        align-items:flex-start;

        padding:28px;
    }

    .widget-wrapper{
        width:min(66vw,1200px);
        min-width:340px;
    }

    #widget{
        width:100%;

        background:rgba(255,255,255,.82);

        backdrop-filter:blur(14px);

        border:1px solid rgba(255,255,255,.65);

        border-radius:26px;

        box-shadow:
            0 10px 34px rgba(15,23,42,.06),
            0 2px 8px rgba(15,23,42,.04);

        overflow:hidden;
    }

    /*
        HEADER
    */

    .header{
        padding:22px 26px 16px;

        border-bottom:
            1px solid rgba(226,232,240,.7);
    }

    .title{
        font-size:24px;
        font-weight:700;

        color:#0f172a;
    }

    .subtitle{
        margin-top:6px;

        font-size:13px;
        color:#64748b;
    }

    /*
        MAIN
    */

    .content{
        padding:20px 22px 24px;

        display:flex;
        flex-direction:column;
        align-items:center;
    }

    /*
        ARC
        jetzt oben NICHT abgeschnitten
        unten nur leicht abgeschnitten
    */

    .timer-wrap{
        position:relative;

        width:360px;
        height:235px;

        overflow:hidden;

        display:flex;
        justify-content:center;
        align-items:flex-start;
    }

    #arc{
        width:320px;
        height:320px;

        margin-top:8px;
    }

    /*
        CENTER
    */

    .center{
        position:absolute;

        top:96px;

        display:flex;
        flex-direction:column;
        align-items:center;
    }

    .time{
        font-size:66px;
        font-weight:800;

        line-height:1;

        letter-spacing:-2px;

        color:#0f172a;
    }

    /*
        FOCUS BUTTON
    */

    .focus-btn{
        margin-top:16px;

        height:40px;

        border:none;

        padding:0 18px;

        border-radius:999px;

        background:#2563eb;
        color:white;

        font-size:13px;
        font-weight:600;

        cursor:pointer;

        transition:.18s;
    }

    .focus-btn:hover{
        background:#1d4ed8;
    }

    /*
        SETTINGS PANEL
    */

    .settings{
        width:100%;
        max-width:460px;

        display:flex;
        gap:10px;

        margin-top:8px;

        opacity:0;
        pointer-events:none;

        transform:translateY(-6px);

        transition:.2s ease;
    }

    .settings.active{
        opacity:1;
        pointer-events:auto;

        transform:translateY(0);
    }

    input{
        flex:1;

        height:44px;

        border-radius:14px;
        border:1px solid #dbe3ec;

        padding:0 16px;

        font-size:14px;

        outline:none;

        background:rgba(255,255,255,.88);
    }

    input:focus{
        border-color:#2563eb;

        box-shadow:
            0 0 0 4px
            rgba(37,99,235,.08);
    }

    .start-btn{
        height:44px;

        border:none;

        padding:0 18px;

        border-radius:14px;

        background:#0f172a;
        color:white;

        font-size:13px;
        font-weight:600;

        cursor:pointer;

        transition:.18s;
    }

    .start-btn:hover{
        background:#020617;
    }

    /*
        FOOTER
    */

    .footer{
        padding:14px 20px;

        border-top:
            1px solid rgba(226,232,240,.7);

        font-size:12px;
        color:#64748b;
    }

    @media (max-width:700px){

        .widget-wrapper{
            width:100%;
        }

        .timer-wrap{
            width:300px;
            height:205px;
        }

        #arc{
            width:280px;
            height:280px;
        }

        .center{
            top:82px;
        }

        .time{
            font-size:56px;
        }

        .settings{
            flex-direction:column;
        }

        .start-btn{
            width:100%;
        }
    }
</style>
</head>

<body>

<div class="widget-wrapper">

    <div id="widget">

        <div class="header">

            <div class="title">
                Focus Timer
            </div>

            <div class="subtitle">
                Minimal arc countdown
            </div>

        </div>

        <div class="content">

            <!-- ARC -->
            <div class="timer-wrap">

                <div id="arc"></div>

                <div class="center">

                    <div
                        class="time"
                        id="time"
                    >
                        25:00
                    </div>

                    <button
                        class="focus-btn"
                        id="focusBtn"
                    >
                        Focus Mode
                    </button>

                </div>

            </div>

            <!-- SETTINGS -->
            <div
                class="settings"
                id="settings"
            >

                <input
                    id="minutes"
                    type="number"
                    min="1"
                    value="25"
                    placeholder="Minuten"
                />

                <button
                    class="start-btn"
                    id="startBtn"
                >
                    Start Timer
                </button>

            </div>

        </div>

        <div class="footer">
            Focus Session Widget
        </div>

    </div>

</div>

<script>
const timeEl   = document.getElementById("time");
const input    = document.getElementById("minutes");

const focusBtn =
    document.getElementById("focusBtn");

const settings =
    document.getElementById("settings");

let total = 25 * 60;
let left  = total;
let timer;

/*
    progressbar.js
*/
const bar = new ProgressBar.Circle("#arc",{

    strokeWidth:4,

    color:"#2563eb",

    trailColor:"rgba(203,213,225,.35)",

    trailWidth:4,

    easing:"linear",

    duration:300,

    svgStyle:null
});

/*
    voller start
*/
bar.set(1);

/*
    format
*/
const format = s =>
    dayjs
        .unix(s)
        .utc()
        .format("mm:ss");

/*
    ui
*/
function update(){

    timeEl.innerText = format(left);

    bar.set(left / total);
}

/*
    start timer
*/
function start(){

    clearInterval(timer);

    total =
        (+input.value || 25) * 60;

    left = total;

    update();

    settings.classList.remove("active");

    timer = setInterval(()=>{

        left--;

        update();

        if(left <= 0){

            clearInterval(timer);

            left = 0;

            update();
        }

    },1000);
}

/*
    toggle settings
*/
focusBtn.onclick = () =>
    settings.classList.toggle("active");

/*
    start btn
*/
document
    .getElementById("startBtn")
    .onclick = start;

/*
    init
*/
update();
</script>

</body>
</html>
