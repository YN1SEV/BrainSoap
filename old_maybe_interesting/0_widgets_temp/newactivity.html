<style></style>


<div class="widget stats_recent">
  <header><h1>Recent Activity</h1></header>
  <main><ul id="activity-list"></ul></main>
</div>

<script>
const activities = [
    {
        domain: "youtube.com",
        action: "Video angesehen",
        duration: "12 min aktiv",
        time: "vor 1 min"
    },
    {
        domain: "github.com",
        action: "Repository geöffnet",
        duration: "7 min aktiv",
        time: "vor 5 min"
    },
    {
        domain: "openai.com",
        action: "Chat verwendet",
        duration: "22 min aktiv",
        time: "vor 9 min"
    },
    {
        domain: "reddit.com",
        action: "Beiträge gelesen",
        duration: "4 min aktiv",
        time: "vor 14 min"
    },
    {
        domain: "readoutto.me",
        action: "Serie angesehen",
        duration: "48 min aktiv",
        time: "vor 27 min"
    }
];

const container = document.getElementById("activity-list");

function getFavicon(domain) {
    return `https://icons.duckduckgo.com/ip3/${domain}.ico`;
}

activities.forEach(item => {
    const el = document.createElement("li");

    el.className = "activity-item";
    el.innerHTML = `
        <img
            class="favicon"
            src="${getFavicon(item.domain)}"
            alt="${item.domain}"
        />

        <div class="content">
            <div class="domain">${item.domain}</div>

            <div class="details">
                ${item.action} · ${item.duration}
            </div>
        </div>

        <div class="time">
            ${item.time}
        </div>
    `;

    container.appendChild(el);
});
</script>
