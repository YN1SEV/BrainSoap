<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Focus Statistics Widget</title>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/countup.js@2/dist/countUp.umd.js"></script>

<style>
    *{
        box-sizing:border-box;
        margin:0;
        padding:0;
        font-family:Inter,Arial,sans-serif;
    }

    body{
        width:100vw;
        height:100vh;

        background:
            linear-gradient(
                180deg,
                #f7f9fc 0%,
                #eef3f8 100%
            );

        display:flex;
        justify-content:center;
        align-items:center;

        padding:20px;
    }

    /*
        1x1
    */

    .widget-wrapper{
        width:min(90vw,90vh);
        aspect-ratio:1/1;

        max-width:760px;
        max-height:760px;
    }

    #widget{
        width:100%;
        height:100%;

        background:rgba(255,255,255,.82);

        backdrop-filter:blur(14px);

        border:1px solid rgba(255,255,255,.65);

        border-radius:28px;

        box-shadow:
            0 10px 34px rgba(15,23,42,.06),
            0 2px 8px rgba(15,23,42,.04);

        overflow:hidden;

        display:flex;
        flex-direction:column;
    }

    /*
        HEADER
    */

    .header{
        padding:22px 24px 18px;

        border-bottom:
            1px solid rgba(226,232,240,.7);
    }

    .title{
        font-size:22px;
        font-weight:700;

        color:#0f172a;
    }

    .subtitle{
        margin-top:6px;

        font-size:13px;
        color:#64748b;
    }

    /*
        CONTENT
    */

    .content{
        flex:1;

        padding:18px;

        display:flex;
        flex-direction:column;

        gap:14px;
    }

    /*
        TOP STATS
    */

    .top-grid{
        display:grid;

        grid-template-columns:
            repeat(2,1fr);

        gap:12px;
    }

    .stat-card{
        background:
            rgba(248,250,252,.92);

        border:
            1px solid #edf2f7;

        border-radius:20px;

        padding:18px;

        transition:.18s;
    }

    .stat-card:hover{
        border-color:#dce6f0;

        background:#f8fbff;
    }

    .stat-label{
        font-size:12px;
        color:#64748b;
    }

    .stat-value{
        margin-top:10px;

        font-size:34px;
        font-weight:800;

        line-height:1;

        letter-spacing:-1px;

        color:#0f172a;
    }

    .stat-sub{
        margin-top:8px;

        font-size:12px;
        color:#94a3b8;
    }

    /*
        CHART
    */

    .chart-card{
        flex:1;

        background:
            rgba(248,250,252,.92);

        border:
            1px solid #edf2f7;

        border-radius:22px;

        padding:16px;

        display:flex;
        flex-direction:column;
    }

    .chart-header{
        display:flex;
        justify-content:space-between;
        align-items:center;

        margin-bottom:10px;
    }

    .chart-title{
        font-size:14px;
        font-weight:700;

        color:#0f172a;
    }

    .chart-tag{
        height:28px;

        padding:0 12px;

        border-radius:999px;

        background:
            rgba(37,99,235,.08);

        color:#2563eb;

        display:flex;
        align-items:center;

        font-size:11px;
        font-weight:700;
    }

    .chart-wrap{
        flex:1;

        position:relative;
    }

    /*
        LOWER GRID
    */

    .bottom-grid{
        display:grid;

        grid-template-columns:
            repeat(3,1fr);

        gap:12px;
    }

    .mini-card{
        background:
            rgba(248,250,252,.92);

        border:
            1px solid #edf2f7;

        border-radius:18px;

        padding:14px;
    }

    .mini-label{
        font-size:11px;
        color:#64748b;
    }

    .mini-value{
        margin-top:8px;

        font-size:22px;
        font-weight:800;

        color:#0f172a;
    }

    /*
        FOOTER
    */

    .footer{
        padding:14px 18px;

        border-top:
            1px solid rgba(226,232,240,.7);

        font-size:12px;
        color:#64748b;
    }

    @media (max-width:700px){

        .top-grid{
            grid-template-columns:1fr;
        }

        .bottom-grid{
            grid-template-columns:1fr;
        }

        .stat-value{
            font-size:28px;
        }
    }
</style>
</head>

<body>

<div class="widget-wrapper">

    <div id="widget">

        <div class="header">

            <div class="title">
                Focus Statistics
            </div>

            <div class="subtitle">
                Scroll suppression analytics
            </div>

        </div>

        <div class="content">

            <!-- TOP -->
            <div class="top-grid">

                <div class="stat-card">

                    <div class="stat-label">
                        Hours in Focus Mode
                    </div>

                    <div
                        class="stat-value"
                        id="focusHours"
                    >
                        0
                    </div>

                    <div class="stat-sub">
                        +12% this week
                    </div>

                </div>

                <div class="stat-card">

                    <div class="stat-label">
                        Hours Scrolled
                    </div>

                    <div
                        class="stat-value"
                        id="scrollHours"
                    >
                        0
                    </div>

                    <div class="stat-sub">
                        -31% this week
                    </div>

                </div>

            </div>

            <!-- CHART -->
            <div class="chart-card">

                <div class="chart-header">

                    <div class="chart-title">
                        Weekly Activity
                    </div>

                    <div class="chart-tag">
                        Focus vs Scroll
                    </div>

                </div>

                <div class="chart-wrap">

                    <canvas id="chart"></canvas>

                </div>

            </div>

            <!-- LOWER -->
            <div class="bottom-grid">

                <div class="mini-card">

                    <div class="mini-label">
                        Times Scrolled
                    </div>

                    <div
                        class="mini-value"
                        id="timesScrolled"
                    >
                        0
                    </div>

                </div>

                <div class="mini-card">

                    <div class="mini-label">
                        Scrolls Blocked
                    </div>

                    <div
                        class="mini-value"
                        id="blocked"
                    >
                        0
                    </div>

                </div>

                <div class="mini-card">

                    <div class="mini-label">
                        Focus Sessions
                    </div>

                    <div
                        class="mini-value"
                        id="sessions"
                    >
                        0
                    </div>

                </div>

            </div>

        </div>

        <div class="footer">
            Focus Extension Analytics
        </div>

    </div>

</div>

<script>
/*
    COUNTUP
*/
new countUp.CountUp(
    "focusHours",
    42.7
).start();

new countUp.CountUp(
    "scrollHours",
    12.3
).start();

new countUp.CountUp(
    "timesScrolled",
    842
).start();

new countUp.CountUp(
    "blocked",
    517
).start();

new countUp.CountUp(
    "sessions",
    73
).start();

/*
    CHART.JS
*/
new Chart(
    document.getElementById("chart"),
{
    type:"line",

    data:{
        labels:[
            "Mo",
            "Di",
            "Mi",
            "Do",
            "Fr",
            "Sa",
            "So"
        ],

        datasets:[
            {
                label:"Focus",

                data:[4,6,7,5,8,9,6],

                borderColor:"#2563eb",

                borderWidth:2,

                tension:.35,

                pointRadius:0,

                fill:false
            },

            {
                label:"Scroll",

                data:[5,4,3,4,2,2,3],

                borderColor:"#ef4444",

                borderWidth:2,

                tension:.35,

                pointRadius:0,

                fill:false
            }
        ]
    },

    options:{

        responsive:true,

        maintainAspectRatio:false,

        plugins:{
            legend:{
                display:false
            }
        },

        scales:{

            x:{
                grid:{
                    display:false
                },

                ticks:{
                    color:"#94a3b8",
                    font:{
                        size:11
                    }
                }
            },

            y:{
                beginAtZero:true,

                grid:{
                    color:"rgba(148,163,184,.12)"
                },

                ticks:{
                    color:"#94a3b8",

                    font:{
                        size:11
                    }
                }
            }
        }
    }
});
</script>

</body>
</html>
