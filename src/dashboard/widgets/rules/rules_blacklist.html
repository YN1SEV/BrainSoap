
<style></style>

<div class="widget rules_timer">
  <header>
    <h1>Blacklist Rules</h1>
    <p>TBD</p>
  </header>
  
  <main>
    <ul class="blacklist" id="blacklist"></ul>

    <form class="create-group">
      <input id="groupInput" placeholder="Neue Liste..." />
      <button id="addGroupBtn" type="submit">
          Liste hinzufügen
      </button>
    </form>

  </main>
</div>

<script>
const blacklist = document.getElementById("blacklist");
const groupInput = document.getElementById("groupInput");
const addGroupBtn = document.getElementById("addGroupBtn");

function siteName(hostname) {
    const clean = hostname.replace("www.", "").split(".")[0];
    return clean.charAt(0).toUpperCase() + clean.slice(1);
}

function updateCount(group) {
    const count = group.querySelectorAll(".url-item").length;
    const countEl = group.querySelector(".group-count");

    if (countEl) {
        countEl.innerText = `${count} Links`;
    }
}

/* -----------------------------
   URL erstellen
----------------------------- */

function createUrlItem(group, rawUrl) {

    if (!rawUrl.trim()) return;

    let finalUrl = rawUrl.trim();

    if (!finalUrl.startsWith("http")) {
        finalUrl = "https://" + finalUrl;
    }

    try {

        const parsed = new URL(finalUrl);
        const hostname = parsed.hostname;

        const li = document.createElement("li");
        li.className = "url-item";

        li.innerHTML = `
            <a href="${finalUrl}" target="_blank" rel="noopener">
                <div>
                    <div class="site-name">${siteName(hostname)}</div>
                    <div class="site-url">${finalUrl}</div>
                </div>
            </a>
        `;

        group.querySelector(".url-list").appendChild(li);

        const items = [...group.querySelectorAll(".url-item")];

        items.sort((a, b) =>
            a.innerText.toLowerCase().localeCompare(
                b.innerText.toLowerCase()
            )
        );

        items.forEach(item =>
            group.querySelector(".url-list").appendChild(item)
        );

        updateCount(group);

        group.querySelector(".url-input").value = "";

    } catch {
        alert("Ungültige URL");
    }
}

/* -----------------------------
   Gruppe erstellen
----------------------------- */

function createGroup(name) {

    const li = document.createElement("li");
    li.className = "group";

    li.innerHTML = `
      <header class="group-header">
        <button class="group-toggle" type="button">
          <div class="group-left">
            <div class="group-letter">${name[0].toUpperCase()}</div>
          
            <div>
              <div class="group-title">${name}</div>
              <div class="group-count">0 Links</div>
            </div>
          </div>
          <div class="arrow">⌄</div>
        </button>
      </header>

      <div class="group-body">
        <ul class="url-list"></ul>
        <form class="add-url">
          <input class="url-input" placeholder="https://example.com"/>
          <button class="add-url-btn">Hinzufügen</button>
        </form>
      </div>
    `;

    /* Toggle */

    const toggle = li.querySelector(".group-toggle");

    toggle.addEventListener("click", () => {
        li.classList.toggle("collapsed");
    });

    /* URL hinzufügen */

    li.querySelector(".add-url")
        .addEventListener("submit", (e) => {

            e.preventDefault();

            const input = li.querySelector(".url-input");

            createUrlItem(li, input.value);
        });

    blacklist.appendChild(li);
}

/* -----------------------------
   Neue Liste
----------------------------- */

function addGroup() {

    const name = groupInput.value.trim();

    if (!name) return;

    createGroup(name);

    groupInput.value = "";
}

addGroupBtn.addEventListener("click", (e) => {
    e.preventDefault();
    addGroup();
});

groupInput.addEventListener("keydown", (e) => {

    if (e.key === "Enter") {
        e.preventDefault();
        addGroup();
    }
});


</script>
