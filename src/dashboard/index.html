<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Don't Change Order -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="structure.css">
  <link rel="stylesheet" href="frame.css">
  <link rel="stylesheet" href="dev.css">
</head>

<body>
  <button class="mini-btn" id="toggle-sidebar">☰</button>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <header><img src="../../assets/icons/icon128.png" alt="BrainSoap"> BrainSoap</header>

    <nav>
      <a href="#home"    ><img src="../../assets/nav/home.svg"    >Home</a>
      <a href="#rules"   ><img src="../../assets/nav/rules.svg"   >Rules</a>
      <a href="#stats"   ><img src="../../assets/nav/stats.svg"   >Statistics</a>
      <a href="#settings"><img src="../../assets/nav/settings.svg">Settings</a>
    </nav>
  </aside>

  <main>
 
    <!-- HOME -->
    <section class="page" id="home">
      <div id="home_dummy1"></div>
      <div id="home_dummy2"></div>
      <div id="home_dummy3"></div>
    </section>

    <!-- RULES -->
    <section class="page" id="rules">
      <div id="rules_timer"    ></div>
      <div id="rules_blacklist"></div>
    </section>

    <!-- STATS -->
    <section class="page" id="stats">
      <!-- Top left -->
      <div id="stats_graph1"   >1</div>
      
      <!-- Top right -->
      <div id="stats_all_time1">
        <header><h1>Statistics</h1></header>
        
        <ul id="stats_all_time1">

          <!------------------------ Focus ------------------------>
          <li class="stat-item">
            <span class="stat-label">Focus Hours</span>
            <span id="focus-hours" class="stat-value"></span>
          </li>

          <li class="stat-item">
            <span class="stat-label">Focus Sessions</span>
            <span id="focus-sessions" class="stat-value"></span>
          </li>

          <li class="stat-item">
            <span class="stat-label">Avg Focus Session</span>
            <span id="avg-focus-session" class="stat-value"></span>
          </li>

          <!------------------------ Scroll ------------------------>
          <li class="stat-item">
            <span class="stat-label">Scroll Hours</span>
            <span id="scroll-hours" class="stat-value"></span>
          </li>

          <li class="stat-item">
            <span class="stat-label">Scroll Attempts</span>
            <span id="scroll-attempts" class="stat-value"></span>
          </li>

          <li class="stat-item">
            <span class="stat-label">Scrolls Blocked</span>
            <span id="scrolls-blocked" class="stat-value"></span>
          </li>

          <li class="stat-item">
            <span class="stat-label">Best Streak</span>
            <span id="best-streak" class="stat-value"></span>
          </li>

          <!------------------------ Misc  ------------------------>
          <li class="stat-item">
            <span class="stat-label">Sites Blocked</span>
            <span id="sites-blocked" class="stat-value"></span>
          </li>

          <li class="stat-item">
            <span class="stat-label">Active Days</span>
            <span id="active-days" class="stat-value"></span>
          </li>
        </ul>
      </div>

      <!-- Bot left -->
      <div id="stats_heatmap1" >2</div>
      
      <!-- Bot right -->
      <div id="stats-recent"  >
        <h1>Recent Activity</h1>
        <ul id="activity-list"></ul>
      </div>
    </section>

    <!-- SETTINGS -->
    <section class="page" id="settings">
      <div id="settings_dummy1"></div>
    </section>

  </main>
</body>


<script src="nav/nav.js"></script>
<script src="load_components.js"></script>

<script src="stats/recent.js"></script>
<script src="stats/all_time.js"></script>
</html>
