<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 300px;
      padding: 15px;
      margin: 0;
      background-color: #f9f9f9;
    }
    h2 { font-size: 1.2rem; margin-top: 0; color: #333; }
    .setting-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: 600; }
    
    input[type="text"], select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .checkbox-group { display: flex; align-items: center; gap: 8px; }
    
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #0056b3; }
    
    #status {
      margin-top: 10px;
      font-size: 0.8rem;
      text-align: center;
      color: green;
      height: 1em;
    }
  </style>
</head>
<body>

  <h2>Settings</h2>

  <div class="setting-group">
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter name...">
  </div>

  <div class="setting-group checkbox-group">
    <input type="checkbox" id="notifications">
    <label for="notifications" style="margin-bottom: 0;">Enable Notifications</label>
  </div>

  <div class="setting-group">
    <label for="theme">Theme</label>
    <select id="theme">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="system">System Default</option>
    </select>
  </div>

  <button id="save">Save Settings</button>
  <div id="status"></div>
  
  <button id="openBigPage">Open big Extension Page</button>

  <script src="settings.js"></script>
</body>
</html>
