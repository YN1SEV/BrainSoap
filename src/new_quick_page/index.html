<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quick control panel for BrainSoap browser extension">

  <title>BrainSoap - Quick Panel</title>

  <!-- Names may Change -->
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>

<body>
<!-- Generic Info-->
  <header>
    <div class="header-left">
      <img src="../../assets/icons/icon48.png" alt="BrainSoap icon" width="48" height="48">
      <h1>BrainSoap</h1>
    </div>

    <a href="../full_page/dashboard.html#/settings" target="_blank" aria-label="Open settings">
      <img src="../../assets/nav/gear.svg" alt="Settings">
    </a>
  </header>

  

  <main>
<!-- Displays most important Info -->
    <section class="status">
      <div class="status-row">
        <span id="display-streak"></span>
        <span id="display-time"></span>
      </div>
      <div id="time-bar"></div>
    </section>
    
<!-- Toggles for important Features -->
    <section>
      <div class="control-text">
        <h2>Focus Mode</h2>
        <p>No scroll-time allowance</p>
      </div>
      <input type="checkbox" id="toggle-focus"/>
    </section>

    <section>
      <div class="control-text">
        <h2>Pause Extension</h2>
        <p>Temporarily disable extension</p>
      </div>
      <input type="checkbox" id="toggle-pause"/>
    </section>
  </main>  
  
<!-- Leads to full page -->
  <footer>
    <a href="../full_page/dashboard.html#/home" target="_blank" class="dashboard-btn"> 
      Dashboard
    </a>
  </footer>
</body>
