<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=285, initial-scale=1.0">
  <meta name="description" content="Quick control panel for BrainSoap browser extension">

  <title>BrainSoap - Quick Panel</title>

  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="popup.css">

  <script type="module" src="popup.js"></script>
</head>

<body>
<!-- Generic Info-->
  <header>
    <div class="header-left">
      <img src="../../../assets/icons/icon48.png" alt="BrainSoap Logo">
      <h1>BrainSoap</h1>
    </div>

    <a
      href="../dashboard/index.html#rules"
      target="_blank"
      rel="noopener"
      class="icon-btn"
    >
      <img src="../../../assets/nav/settings.svg" alt="">
      <span class="visually-hidden">Open rules in the dashboard</span>
    </a>
  </header>



  <main aria-label="Quick controls">
<!-- Displays most important Info -->
    <section class="status" aria-label="Current page and remaining time">
      <div class="status-row" aria-live="polite">
        <span id="display-streak">Loading…</span>
        <span id="display-time"></span>
      </div>
      <div id="time-bar"
           role="progressbar"
           aria-label="Time limit used"
           aria-valuemin="0"
           aria-valuemax="100"
           aria-valuenow="0"
           aria-valuetext="No limit"></div>
    </section>

<!-- Toggles for important Features -->
    <section>
      <label class="toggle-control" for="toggle-focus">
        <div class="control-text">
          <h2>Focus Mode</h2>
          <p id="focus-desc">No scroll-time allowance</p>
        </div>
        <input type="checkbox" id="toggle-focus" aria-describedby="focus-desc">
      </label>
    </section>

    <section>
      <label class="toggle-control" for="toggle-pause">
        <div class="control-text">
          <h2>Pause Extension</h2>
          <p id="pause-desc">Temporarily disable extension</p>
        </div>
        <input type="checkbox" id="toggle-pause" aria-describedby="pause-desc">
      </label>
    </section>
  </main>

<!-- Leads to full page -->
  <footer aria-label="Dashboard navigation">
    <a
      href="../dashboard/index.html#stats"
      target="_blank"
      rel="noopener"
      class="dashboard-btn"
    >
      Dashboard
    </a>
  </footer>
</body>
</html>
