<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quick control panel for BrainSoap browser extension">

  <title>BrainSoap - Quick Panel</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>

<body>
<!-- Generic Info-->
  <header>
    <div class="header-left">
      <img src="../../assets/icons/icon48.png" alt="">
      <h1>BrainSoap</h1>
    </div>

    <a 
      href="../full_page/dashboard.html#/settings" 
      target="_blank" 
      rel="noopener" 
      aria-label="Open settings"
    >
      <img src="../../assets/nav/gear.svg" alt="">
    </a>
  </header>

  

  <main aria-label="Quick controls">
<!-- Displays most important Info -->
    <section class="status" aria-label="Current status">
      <div class="status-row">
        <span id="display-streak" aria-live="polite"></span>
        <span id="display-time" aria-live="polite"></span>
      </div>
      <div id="time-bar" aria-hidden="true"></div>
    </section>
    
<!-- Toggles for important Features -->
    <section>
      <div class="control-text">
        <h2 id="focus-mode-title">Focus Mode</h2>
        <p id="focus-mode-description">No scroll-time allowance</p>
      </div>
      <input
        type="checkbox"
        id="toggle-focus"
        aria-labelledby="focus-mode-title"
        aria-describedby="focus-mode-description"
      >
    </section>

    <section>
      <div class="control-text">
        <h2 id="pause-extension-title">Pause Extension</h2>
        <p id="pause-extension-description">Temporarily disable extension</p>
      </div>
      <input
        type="checkbox"
        id="toggle-pause"
        aria-labelledby="pause-extension-title"
        aria-describedby="pause-extension-description"
      >
    </section>
  </main>  
  
<!-- Leads to full page -->
  <footer aria-label="Dashboard navigation">
    <a 
      href="../full_page/dashboard.html#/home" 
      target="_blank" 
      rel="noopener" 
      class="dashboard-btn"
    >
      Dashboard
    </a>
  </footer>
</body>
