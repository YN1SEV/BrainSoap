<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quick control panel for BrainSoap browser extension">

  <title>BrainSoap - Quick Panel</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>

<body>
<!-- Generic Info-->
  <header>
    <div class="header-left">
      <img src="../../assets/icons/icon48.png" alt="BrainSoap Logo">
      <h1>BrainSoap</h1>
    </div>

    <a 
      href="../full_page/dashboard.html#/settings" 
      target="_blank" 
      rel="noopener" 
      class="icon-btn"
    >
      <img src="../../assets/nav/gear.svg" alt="Open Settings">
    </a>
  </header>

  

  <main aria-label="Quick controls">
<!-- Displays most important Info -->
    <section class="status" aria-label="Current status">
      <div class="status-row">
        <span id="display-streak"></span>
        <span id="display-time"></span>
      </div>
      <div id="time-bar"></div>
    </section>
    
<!-- Toggles for important Features -->
    <section>
      <label class="toggle-control" for="toggle-focus">
        <div class="control-text">
          <h2>Focus Mode</h2>
          <p>No scroll-time allowance</p>
        </div>
        <input type="checkbox" id="toggle-focus">
      </label>
    </section>

    <section>
      <label class="toggle-control" for="toggle-pause">
        <div class="control-text">
          <h2>Pause Extension</h2>
          <p>Temporarily disable extension</p>
        </div>
        <input type="checkbox" id="toggle-pause">
      </label>
    </section>
  </main>  
  
<!-- Leads to full page -->
  <footer aria-label="Dashboard navigation">
    <a 
      href="../full_page/dashboard.html#/home" 
      target="_blank" 
      rel="noopener" 
      class="dashboard-btn"
    >
      Dashboard
    </a>
  </footer>
</body>
