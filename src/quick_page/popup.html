<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <header>
        <h1>BrainSoap</h1>

        <button class="icon-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.1 7.1 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 1h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.91 7.98a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L3.03 13.66a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.4.31.6.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.58-.23 1.12-.54 1.63-.94l2.39.96c.2.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/>
            </svg>
        </button>
    </header>
       
    <hr>

    <section class="displayStats">
        <div id="displayStreak"></div>
        <div id="displayTime"></div>
    </section>

    <div class="timeContainer">
        <div class="timeBar" id="timeBar"></div>
    </div>

    <hr>
    
    <section class="setting">
        <label class="switch">
            <input type="checkbox" id="togglePause">
            <span class="slider"></span>
        </label>

        <div class="settingLabel">
            <h3>Pause Extension</h3>
            <p>Temporarily stops blocking</p>
        </div>
    </section>

    <hr>

    <section class="setting">
        <label class="switch">
            <input type="checkbox" id="toggleFocus">
            <span class="slider"></span>
        </label>

        <div class="settingLabel">
            <h3>Focus Mode</h3>
            <p>No scroll-time allowance</p>
        </div>
    </section>

    <hr>

    <section class="setting">
        <label class="switch">
            <input type="checkbox" id="tbd">
            <span class="slider"></span>
        </label>

        <div class="settingLabel">
            <h3>Filler Thingy</h3>
            <p>Only 2 seems empty, however I</p>
            <p>don't want unnecessary elements</p>
        </div>
    </section>

    <hr>

    <footer>
        <button class="bigButton" id="dashboardOpen">Open Dashboard</button>
    </footer>




</body>

<script src="popup.js"></script>

</html>
